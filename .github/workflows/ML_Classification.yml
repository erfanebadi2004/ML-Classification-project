name: ML Project CI/CD Pipeline

on:
  push:
    branches: ["master"]

jobs:
  compial-and-UniTest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run Tests With Pytest
        run: pytest

      - name: Build Docker Image
        run: |
          docker build -f src/Dockerfile -t ml-classification:latest src/

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          
      - name: Push Ducker Image to Docker Hub
        run: |
          docker tag ml-classification:latest ${{ secrets.DOCKER_HUB_USERNAME }}/ml-classification:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ml-classification:latest
